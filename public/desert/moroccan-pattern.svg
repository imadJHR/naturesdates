<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <g id="star" fill="none" stroke="#C9A24B" stroke-width="1.1" opacity="0.55">
      <rect x="-26" y="-26" width="52" height="52" transform="rotate(22.5)"/>
      <rect x="-26" y="-26" width="52" height="52" transform="rotate(-22.5)"/>
      <circle r="10"/>
    </g>
    <g id="diamond" fill="none" stroke="#C9A24B" stroke-width="1.1" opacity="0.45">
      <rect x="-9" y="-9" width="18" height="18" transform="rotate(45)"/>
    </g>
  </defs>
  <use href="#star" x="80" y="80"/>
  <use href="#star" x="0" y="0"/>
  <use href="#star" x="160" y="0"/>
  <use href="#star" x="0" y="160"/>
  <use href="#star" x="160" y="160"/>
  <use href="#diamond" x="40" y="40"/>
  <use href="#diamond" x="120" y="40"/>
  <use href="#diamond" x="40" y="120"/>
  <use href="#diamond" x="120" y="120"/>
  <use href="#diamond" x="0" y="80"/>
  <use href="#diamond" x="160" y="80"/>
  <use href="#diamond" x="80" y="0"/>
  <use href="#diamond" x="80" y="160"/>
</svg>
